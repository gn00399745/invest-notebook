<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 投資筆記</title>
<meta name="description" content="總經、產業、個股研究、ETF 健檢與投資策略的個人投資筆記工具">
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="投資筆記">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">📈</span>
    <div>
      <div class="title">AI 投資筆記</div>
      <div class="subtitle">記帳・資產・投資研究</div>
    </div>
  </div>
  <div class="top-actions">
    <button id="installBtn" class="btn-gold" hidden>安裝</button>
    <button class="icon-btn" data-go="settings" title="設定與備份">⚙︎</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-go="home" data-tab="home" class="active"><i>💰</i><span>資產</span></button>
  <button data-go="ledger" data-tab="ledger"><i>🧾</i><span>收支</span></button>
  <button data-go="cards" data-tab="research"><i>🔍</i><span>研究</span></button>
  <button data-go="macro" data-tab="market"><i>🌐</i><span>市場</span></button>
  <button data-go="more" data-tab="more"><i>☰</i><span>更多</span></button>
</nav>

<main id="view"></main>

<dialog id="modal">
  <form method="dialog" id="modalForm">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button type="button" class="btn-danger" id="modalDelete" hidden>刪除</button>
      <span class="spacer"></span>
      <button type="button" class="btn-ghost" id="modalCancel">取消</button>
      <button type="submit" class="btn-primary" id="modalSave">儲存</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast"></div>

<footer class="foot">資料只存在這台裝置的瀏覽器中，請定期到 ⚙︎ 匯出備份。本工具僅供個人研究紀錄，不構成投資建議。</footer>

<script src="examples.js"></script>
<script src="app.js"></script>
<script src="features.js"></script>
<script src="learn.js"></script>
<script src="wallet.js"></script>
</body>
</html>
